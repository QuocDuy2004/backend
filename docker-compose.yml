version: '3.8'

services:
  backend:
    image: ${DOCKER_HUB_USERNAME}/velocart-backend:latest
    # Hoặc build từ local:
    # build: .
    container_name: velocart-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - velocart-network

  db:
    image: mysql:8.0
    container_name: velocart-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/omnishop_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - velocart-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: velocart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - velocart-network

volumes:
  mysql_data:

networks:
  velocart-network:
    driver: bridge
