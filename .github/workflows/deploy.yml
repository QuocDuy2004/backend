name: Backend CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Stop old process (if running)
      shell: pwsh
      run: |
        # Tìm và kill process đang chạy trên port 3000
        $process = Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique
        if ($process) {
          Stop-Process -Id $process -Force
          Write-Host "Stopped process $process on port 3000"
        }
      continue-on-error: true

    - name: Start application
      shell: pwsh
      run: |
        # Start server in background
        Start-Process -NoNewWindow -FilePath "node" -ArgumentList "dist/server.cjs"
        Write-Host "Application started successfully"
