name: Deploy to Render

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ── 1. Build & Lint Check ─────────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Type check
        run: npm run lint
        shell: bash

      - name: Build application
        run: npm run build
        shell: bash

      - name: Verify build output
        run: |
          test -f dist/server.cjs && echo "✅ dist/server.cjs exists" || (echo "❌ Build output missing" && exit 1)
        shell: bash

  # ── 2. Deploy lên Render (chỉ khi push lên main/master) ───────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        # Tạo Deploy Hook trên Render: Service → Settings → Deploy Hook → Copy URL
        # Lưu URL vào GitHub Secret tên: RENDER_DEPLOY_HOOK_URL
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | grep -q "HTTP 2" \
            && echo "✅ Render deploy triggered" \
            || echo "⚠️  Deploy hook failed or RENDER_DEPLOY_HOOK_URL not set"
        continue-on-error: true

      - name: Wait for deploy & health check
        # Chờ Render build xong (tối đa ~5 phút) rồi ping health endpoint
        # Lưu URL backend vào GitHub Secret tên: RENDER_APP_URL
        # Ví dụ: https://your-app.onrender.com
        if: ${{ secrets.RENDER_APP_URL != '' }}
        run: |
          echo "Waiting 60s for Render to start deploy..."
          sleep 60

          MAX_RETRIES=10
          RETRY_INTERVAL=30
          URL="${{ secrets.RENDER_APP_URL }}/api/health"

          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i/$MAX_RETRIES – HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Service is healthy"
              exit 0
            fi
            sleep $RETRY_INTERVAL
          done

          echo "⚠️  Health check did not pass after $MAX_RETRIES retries (non-blocking)"
        continue-on-error: true
