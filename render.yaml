services:
  - type: web
    name: backend
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/db
    envVars:
      - key: NODE_ENV
        value: production
      # Set các biến sau trên Render Dashboard:
      # DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_DATABASE
      # DB_CONNECTION_LIMIT, JWT_SECRET, JWT_EXPIRES_IN
